server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : toutes les routes non-assets renvoient à index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pas de proxy ici : le front appelle /api en absolu vers le domaine.
    # Le reverse proxy /api est géré par le nginx de edge (voir nginx/default.conf).
}
