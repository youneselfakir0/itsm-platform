services:
  postgres:
    image: postgres:16-alpine
    container_name: itsm-postgres
    environment:
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm_dev_pw
      POSTGRES_DB: itsm
    ports:
      - "5433:5432"
    volumes:
      - itsm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: itsm-redis
    ports:
      - "6380:6379"

volumes:
  itsm_pgdata:
