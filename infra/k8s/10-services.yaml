apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: itsm
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: registry.local/itsm/gateway:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - secretRef: { name: itsm-secrets }
            - configMapRef: { name: itsm-config }
          env:
            - { name: PORT, value: "8080" }
            - { name: START_PATH, value: "gateway/src/index.js" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: itsm
spec:
  selector: { app: gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
---
