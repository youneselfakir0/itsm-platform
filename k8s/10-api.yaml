apiVersion: apps/v1
kind: Deployment
metadata:
  name: itsm-api
  namespace: twisteritsm
  labels:
    app: itsm-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: itsm-api
  template:
    metadata:
      labels:
        app: itsm-api
    spec:
      containers:
        - name: api
          image: registry.twisterlab.local/twisteritsm/api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: itsm-config
            - secretRef:
                name: itsm-secrets
          readinessProbe:
            httpGet:
              path: /api/auth/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/auth/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: itsm-api
  namespace: twisteritsm
spec:
  selector:
    app: itsm-api
  ports:
    - port: 8080
      targetPort: 8080
