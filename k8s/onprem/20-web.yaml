apiVersion: apps/v1
kind: Deployment
metadata:
  name: itsm-web
  namespace: twisteritsm
  labels:
    app: itsm-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: itsm-web
  template:
    metadata:
      labels:
        app: itsm-web
    spec:
      containers:
        - name: web
          image: itsm-web:test
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: itsm-web
  namespace: twisteritsm
spec:
  selector:
    app: itsm-web
  ports:
    - port: 80
      targetPort: 80
