# ARCHIVÉ — Sauvegarde de l'Ingress itsm-ingress tel que déployé en lab
# (état réel au 2026-07-23, nettoyé des champs d'état Kubernetes).
# Non maintenu. Référence uniquement : ingressClass traefik, TLS itsm-tls,
# routes /api -> itsm-api:8080, / -> itsm-web:80, host itsm.twisterlab.local.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: itsm-ingress
  namespace: twisteritsm
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: itsm.twisterlab.local
    http:
      paths:
      - backend:
          service:
            name: itsm-api
            port:
              number: 8080
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: itsm-web
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - itsm.twisterlab.local
    secretName: itsm-tls
