services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itsm_dev_pw}
      POSTGRES_DB: itsm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://itsm:${POSTGRES_PASSWORD:-itsm_dev_pw}@postgres:5432/itsm
      JWT_SECRET: ${JWT_SECRET:-change-me}
      AI_API_URL: ${AI_API_URL:-http://192.168.0.20:11434}
      AI_MODEL: ${AI_MODEL:-qwen3:8b}
      AI_CODER_MODEL: ${AI_CODER_MODEL:-qwen2.5-coder:latest}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-itsm@twisterlab.local}
      TEAMS_WEBHOOK: ${TEAMS_WEBHOOK:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-ops@twisterlab.local}
      SLA_TIMER_MS: ${SLA_TIMER_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: frontend/webapp/Dockerfile
    ports:
      - "5174:80"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - web

volumes:
  pgdata:
